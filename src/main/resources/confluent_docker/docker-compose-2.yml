services:
  zookeeper-dr:
    image: confluentinc/cp-zookeeper:7.2.6
    hostname: zookeeper-dr
    container_name: zookeeper-dr
    ports:
      - "12181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 12181
      ZOOKEEPER_TICK_TIME: 2000

  broker-dr:
    image: confluentinc/cp-server:7.2.6
    hostname: broker-dr
    container_name: broker-dr
    depends_on:
      - zookeeper-dr
    ports:
      - "19092:9092"
      - "19101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper-dr:12181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-dr:21909,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry-dr:18081
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker-dr:21909
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: 'true'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'

  schema-registry-dr:
    image: confluentinc/cp-schema-registry:7.2.6
    hostname: schema-registry-dr
    container_name: schema-registry-dr
    depends_on:
      - broker-dr
    ports:
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry-dr
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker-dr:21909'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  connect-dr:
    image: confluentinc/cp-server-connect:7.2.6
    hostname: connect-dr
    container_name: connect-dr
    depends_on:
      - broker-dr
      - schema-registry-dr
    ports:
      - "18083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'broker-dr:21909'
      CONNECT_REST_ADVERTISED_HOST_NAME: connect-dr
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry-dr:18081
      # CLASSPATH required due to CC-2422
      CLASSPATH: /usr/share/java/monitoring-interceptors/monitoring-interceptors-7.2.6.jar
      CONNECT_PRODUCER_INTERCEPTOR_CLASSES: "io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor"
      CONNECT_CONSUMER_INTERCEPTOR_CLASSES: "io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: org.apache.zookeeper-dr=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR

  control-center-dr:
    image: confluentinc/cp-enterprise-control-center:7.2.6
    hostname: control-center-dr
    container_name: control-center-dr
    depends_on:
      - broker-dr
      - schema-registry-dr
      - connect-dr
      - rest-proxy-dr
    ports:
      - "19021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker-dr:21909'
      CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: 'connect-dr:18083'
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry-dr:18081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  rest-proxy-dr:
    image: confluentinc/cp-kafka-rest:7.2.6
    depends_on:
      - broker-dr
      - schema-registry-dr
    ports:
      - 18082:8082
    hostname: rest-proxy-dr
    container_name: rest-proxy-dr
    environment:
      KAFKA_REST_HOST_NAME: rest-proxy-dr
      KAFKA_REST_BOOTSTRAP_SERVERS: 'broker-dr:21909'
      KAFKA_REST_LISTENERS: "http://0.0.0.0:18082"
      KAFKA_REST_SCHEMA_REGISTRY_URL: 'http://schema-registry-dr:18081'